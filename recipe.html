
<!DOCTYPE html>
<html>
<head>
    <title>Upload Recipes</title>
    <style>
         body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #f5f5dc;
        }
        .recipes, .login, .register, .categories, .profile, .recipe-details {
            padding: 20px;
            text-align: center;
            display: left;
        }
        .recipes h2, .login h2, .register h2, .categories h2, .profile h2, .recipe-details h2 {
            font-size: 32px;
            color: #f5f5dc;
            margin-bottom: 20px;
        }
        .recipes text textarea img {
            padding-left: 20px; 
            min-height: 500px;       
        }

        .recipes .recipe-item h3 {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="recipes">
    <h2>Upload Recipe</h2>
    <form action="" method="post" enctype="multipart/form-data">
        <div class="recipeData">
        {{ form.hidden_tag() }}
        <label for="title">Title:</label>
            {{ form.title(size=20) }}
        </br>
        <label for="description">Description:</label>
            {{ form.description }}
        </br>
        <label for="cooking_time">Cooking Time:</label>
        {{ form.cooking_time(size=20) }}
        </br>
        <label for="servings">Servings:</label>
        {{ form.servings(size=20) }}
        </br>
        <label for="image">Image:</label>
        {{ form.image}}
        </br>
        </br>
        {{ form.submit() }}
       
        <!--<input id="cancel" name="cancel" type="button" value="Cancel" h>
        </br>-->
        <a id= 'recipeurl' href="{{recipeurl}}">Cancel</a>
    </div>
    </form>
    <!--<button name="cancel" href={{recipeurl}}>Cancel</button>-->
</div>
</body>
</html>
