<!DOCTYPE html>
<html lang="en">
<head>
    <title>Recipe App</title>
 <!--   <link href="C:\aanya\app\templates\mycss.css" type="text/css" rel="stylesheet" > -->
<style>
    body {
        margin: 0;
        font-family: 'SUMAC', 'Arial Narrow', Arial, sans-serif, sans-serif;
        background-color: #000000;
        color: #f5f5dc;
    }
    .navbar {
        background-color: #000000;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .navbar a {
        color: #f5f5dc;
        text-decoration: none;
        font-size: 18px;
        margin: 0 10px;
    }
    .navbar .left {
        display: flex;
        align-items: center;
    }
    .navbar .right {
        display: flex;
        align-items: center;
    }
    .navbar .right a {
        background-color: #f5f5dc;
        color: #000000;
        padding: 10px 20px;
        border-radius: 5px;
        margin-left: 10px;
    }
    .hero {
        position: relative;
        text-align: center;
        color: #f5f5dc;
    }
    .hero img {
        width: calc(100% - 200px);
        height: auto;
        border-left: 0.5in solid #f5f5dc;
        border-right: 0.5in solid #f5f5dc;
        border-top: 0.25in solid #f5f5dc;
        border-bottom: 0.25in solid #f5f5dc;
    }
    .hero .content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #f5f5dc;
        color: #000000;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }
    .hero .content h1 {
        margin: 0;
        font-size: 36px;
    }
    .hero .content p {
        font-size: 18px;
        margin: 10px 0;
    }
    .recipes, .login, .register, .categories, .profile, .recipe-details {
        padding: 20px;
        text-align: center;
        display: none;
    }
    .recipes h2, .login h2, .register h2, .categories h2, .profile h2, .recipe-details h2 {
        font-size: 28px;
        margin-bottom: 20px;
    }
    .recipes .recipe-item, .login .login-form, .register .register-form, .categories .category-item, .profile .profile-info, .recipe-details .ingredients, .recipe-details .steps, .recipe-details .comments {
        margin-bottom: 20px;
    }
    .recipes .recipe-item img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        border-left: 0.5in solid #f5f5dc;
        border-right: 0.5in solid #f5f5dc;
        border-top: 0.25in solid #f5f5dc;
        border-bottom: 0.25in solid #f5f5dc;
    }
    .recipes .recipe-item h3 {
        font-size: 24px;
        margin: 10px 0;
    }
    .login .login-form input, .login .login-form textarea, .register .register-form input, .comments .comment-form textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #000000;
        color: #f5f5dc;
    }
    .login .login-form button, .register .register-form button, .comments .comment-form button {
        background-color: #f5f5dc;
        color: #000000;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
    .login .login-form textarea, .comments .comment-form textarea {
        min-height: 60px;
        background-color: #000000;
        color: #f5f5dc;
        box-shadow: 0 1px 3px rgba(21, 18, 18, 0.772);
        font-size: 14px;
        padding: 10px;
    }
    .recipes-table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
    }
    .recipes-table th, .recipes-table td {
        border: 1px solid #ddd;
        padding: 8px;
    }
    .recipes-table th {
        background-color: #000000;
        color: #f5f5dc;
        text-align: left;
    }
    .recipes-table td a {
        color: #f5f5dc;
        text-decoration: none;
    }
    .categories .category-item a {
        color: #f5f5dc;
        text-decoration: none;
        font-size: 20px;
    }
    .profile .profile-info img {
        border-radius: 50%;
        width: 150px;
        height: 150px;
        border-left: 0.5in solid #f5f5dc;
        border-right: 0.5in solid #f5f5dc;
        border-top: 0.25in solid #f5f5dc;
        border-bottom: 0.25in solid #f5f5dc;
    }
    .profile .profile-info h3 {
        font-size: 24px;
        margin: 10px 0;
    }
    .profile .profile-info p {
        font-size: 18px;
        margin: 5px 0;
    }
    .comments .comment-item {
        text-align: left;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 10px;
    }
    .comments .comment-item h4 {
        font-size: 20px;
        margin: 5px 0;
    }
    .comments .comment-item p {
        font-size: 16px;
        margin: 5px 0;
    }
    .recipe-details .ingredients ul, .recipe-details .steps ol {
        text-align: left;
        display: inline-block;
        margin: 0;
        padding: 0;
    }
    .recipe-details .ingredients ul li, .recipe-details .steps ol li {
        font-size: 18px;
        margin: 5px 0;
    }
    .recipe-details img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        border-left: 0.5in solid #f5f5dc;
        border-right: 0.5in solid #f5f5dc;
        border-top: 0.25in solid #f5f5dc;
        border-bottom: 0.25in solid #f5f5dc;
        margin-bottom: 20px;
    }
</style>
</head>

</html>
